{% extends "base.html" %}

{% block content %}
<h1>Delete Grade</h1>

<p>Delete grade for <strong>{{ object.enrollment.student }}</strong>
   in <strong>{{ object.enrollment.course }}</strong>?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
</form>

<a href="{% url 'students:grade-list' %}">Cancel</a>
{% endblock %}
