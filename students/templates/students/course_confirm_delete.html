{% extends "base.html" %}
{% block title %}Delete Course{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Delete Course</h1>
</div>

<p style="color:#636E72; margin-bottom:1.5rem;">
    Are you sure you want to delete <strong style="color:#DFE6E9;">{{ object }}</strong>?
    This action cannot be undone.
</p>

<form method="post">
    {% csrf_token %}
    <div style="display:flex; gap:1rem;">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'students:course-list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
